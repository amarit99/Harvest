<!doctype html>
<html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
  body { position: relative; background:
      radial-gradient(ellipse 75% 55% at 50% 45%, rgba(255,215,150,.28), transparent 75%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='c'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .33  0 0 0 0 .16  0 0 0 .9 0'/></filter><rect width='100%' height='100%' fill='%23855a33'/><rect width='100%' height='100%' filter='url(%23c)'/></svg>"); }
  .photo { position: absolute; background: #f4f1e8; padding: 16px 16px 58px; box-shadow: 0 14px 28px rgba(0,0,0,.55); z-index: 2; text-align: center; font-family: 'Kanit'; font-weight: 700; font-size: 32px; width: 300px; }
  .photo .ph { height: 300px; background: linear-gradient(#3b3a40, #1c1b20); position: relative; overflow: hidden; margin-bottom: 8px; }
  .photo .ph::before { content: ""; position: absolute; left: 50%; top: 60px; width: 110px; height: 110px; margin-left: -55px; border-radius: 50%; background: #0c0c0f; }
  .photo .ph::after { content: ""; position: absolute; left: 50%; bottom: -60px; width: 220px; height: 180px; margin-left: -110px; border-radius: 50% 50% 0 0; background: #0c0c0f; }
  .photo small { display: block; font-weight: 300; font-size: 22px; }
  .card { position: absolute; background: #fff27a; padding: 14px 20px; font-family: 'Sriracha'; font-size: 28px; line-height: 1.35; box-shadow: 0 10px 22px rgba(0,0,0,.45); z-index: 3; width: 340px; padding-left: 56px; }
  .pin { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8a8a, #c0262d 55%, #6d0f14); box-shadow: 4px 8px 8px rgba(0,0,0,.5); z-index: 6; }
  svg.str { position: absolute; inset: 0; z-index: 1; }
  .badge { position: absolute; left: 50%; top: 135px; z-index: 4; width: 90px; height: 90px; margin-left: -45px; border-radius: 50%; background: #c0a040; color: #222; display: grid; place-items: center; font-family: 'Kanit'; font-weight: 900; font-size: 34px; box-shadow: 0 6px 12px rgba(0,0,0,.4); }
  .big { position: absolute; left: 60px; right: 60px; top: 1360px; z-index: 4; text-align: center; font-family: 'Sriracha'; font-size: 46px; color: #fff; background: rgba(15,10,8,.86); padding: 20px; border-radius: 12px; transform: rotate(-1deg); line-height: 1.4; }
  .big b { color: #ff5156; font-weight: 400; }
</style></head>
<body class="grain">
  <div class="tag"><b>บอร์ดคดี</b> ตำรวจของใคร</div>
  <div class="photo" style="left:390px; top:240px; transform:rotate(1deg)"><div class="ph"></div><div class="badge" style="top:90px">ตร.</div>ร.ต.ท. สมหมาย<small>ร้อยเวร</small></div>
  <div class="photo" style="left:60px; top:820px; transform:rotate(-4deg)"><div class="ph"></div>ธวัช รุ่งเรือง<small>เจ้าของตึก</small></div>
  <div class="card" style="left:690px; top:720px; transform:rotate(3deg)">นั่งโต๊ะ VIP เดียวกัน คืนเกิดเหตุ</div>
  <div class="card" style="left:690px; top:930px; transform:rotate(-2deg)">ปิดคดีด้วยแบบฟอร์มย้อนหลัง</div>
  <div class="card" style="left:690px; top:1120px; transform:rotate(2deg)">ดาวน์รถเงินสด 300,000</div>
  <div class="card" style="left:40px; top:560px; padding-left:60px; transform:rotate(-3deg); background:#ffd1dc">รับแจ้งความ 10:20 → ข้อความขู่ 10:27 จากเลขาฯ ธวัช</div>
  <svg class="str" viewBox="0 0 1080 1920" fill="none" stroke="#d1141b" stroke-width="5">
    <path d="M540 255 Q 330 520 210 840"/><path d="M540 255 Q 700 500 715 745"/><path d="M210 840 Q 500 900 715 955"/><path d="M210 840 Q 480 1100 715 1145"/><path d="M540 255 Q 300 400 80 585"/>
  </svg>
  <div class="pin" style="left:540px; top:255px"></div><div class="pin" style="left:210px; top:840px"></div>
  <div class="pin" style="left:715px; top:745px"></div><div class="pin" style="left:715px; top:955px"></div><div class="pin" style="left:715px; top:1145px"></div><div class="pin" style="left:80px; top:585px"></div>
  <div class="big">ผมไม่ส่งหลักฐานให้โรงพักนี้อีกแล้ว<br><b>ผมจะส่งให้ทุกคนเห็นพร้อมกัน</b></div>
</body></html>
