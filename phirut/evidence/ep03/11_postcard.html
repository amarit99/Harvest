<!doctype html>
<html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
  body { position: relative; background:
    radial-gradient(ellipse 60% 35% at 50% 42%, rgba(255,205,130,.30), transparent 75%),
    linear-gradient(180deg, #1d150e 0%, #0d0906 60%, #050403 100%); }
  .pc { position: absolute; left: 60px; top: 470px; width: 960px; height: 640px; background: #efe6cf; transform: rotate(-4deg); box-shadow: 0 30px 60px rgba(0,0,0,.8); padding: 40px; }
  .pc::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 20% 80%, rgba(120,90,40,.25), transparent 50%); }
  .div { position: absolute; left: 560px; top: 50px; bottom: 50px; width: 2px; background: #a38c62; }
  .msg { position: absolute; left: 44px; top: 50px; width: 490px; font-family: 'Sriracha'; font-size: 33px; line-height: 1.5; color: #1a1f45; }
  .to { position: absolute; left: 600px; top: 300px; width: 320px; font-family: 'Sriracha'; font-size: 28px; line-height: 2; color: #1a1f45; }
  .to div { border-bottom: 2px solid #a38c62; }
  .stampbox { position: absolute; right: 40px; top: 40px; width: 140px; height: 170px; border: 6px dotted #c55; background: #f6d7a7; display: grid; place-items: center; font-family: 'Kanit'; color: #a13; font-size: 26px; text-align: center; line-height: 1.2; }
  .pm { position: absolute; right: 120px; top: 120px; width: 220px; height: 220px; border-radius: 50%; border: 5px solid rgba(40,40,60,.6); display: grid; place-items: center; text-align: center; font-family: 'Kanit'; font-size: 24px; color: rgba(40,40,60,.75); transform: rotate(-14deg); line-height: 1.3; }
  .cap { position: absolute; left: 0; right: 0; top: 1240px; text-align: center; font-family: 'Kanit'; font-weight: 300; font-size: 42px; letter-spacing: 3px; color: #cdbf9f; line-height: 1.5; }
  .cap b { display: block; font-weight: 700; font-size: 56px; color: #fff; letter-spacing: 1px; }
</style></head>
<body class="grain">
  <div class="pc">
    <div class="msg">คุณภาสกร<br>ข้อความคืนนั้น… ฉันส่งเอง<br>ฉันไปถึงช้าไปสิบนาที<br>ฉันเห็นว่าใครผลักคุณ<br><u>และเขาก็เห็นฉันเหมือนกัน</u><br>อย่าตามหาฉัน &nbsp;— ด.</div>
    <div class="div"></div>
    <div class="stampbox">ไปรษณีย<br>๓ บาท</div>
    <div class="pm">ไปรษณีย์<br>ปากช่อง (?)<br>3 ส.ค. 69</div>
    <div class="to"><div>ถึง คุณภาสกร มั่นคง</div><div>ห้อง 304 สุขสันต์แมนชั่น</div><div>(ฝากเจ๊หน้าหอ)</div></div>
  </div>
  <div class="cap">โปสการ์ดที่เจ๊หอพักยื่นให้ผม<b>พร้อมใบทวงค่าห้อง</b></div>
</body></html>
