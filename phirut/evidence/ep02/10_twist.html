<!doctype html>
<html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
  body { position: relative; background:
    radial-gradient(ellipse 60% 35% at 50% 42%, rgba(255,205,130,.30), transparent 75%),
    linear-gradient(180deg, #1d150e 0%, #0d0906 60%, #050403 100%); }
  .strip { position: absolute; left: 70px; width: 940px; padding: 26px 34px; box-shadow: 0 24px 50px rgba(0,0,0,.75); }
  .a { top: 330px; transform: rotate(-2.5deg); background: repeating-linear-gradient(180deg, transparent 0 95px, rgba(70,110,180,.35) 95px 97px), #f3eedb; height: 230px; }
  .a .r { font-family: 'Sriracha'; font-size: 44px; color: #1c2a5e; line-height: 1.35; }
  .a .r b { font-weight: 400; }
  .lbl { position: absolute; left: 0; top: -58px; font-family: 'Kanit'; font-size: 30px; color: #e8dcc3; letter-spacing: 2px; }
  .b { top: 850px; transform: rotate(2deg); background: var(--paper); height: 260px; font-size: 32px; text-align: center; }
  .b .sig { font-family: 'Charmonman'; color: #1d2b6b; font-size: 76px; line-height: 1.2; display: block; border-bottom: 2px dotted #333; width: 360px; margin: 0 auto 8px; }
  svg.m { position: absolute; inset: 0; z-index: 5; }
  .big { position: absolute; left: 0; right: 0; top: 1270px; text-align: center; font-family: 'Kanit'; color: #fff; }
  .big small { display: block; font-weight: 300; font-size: 44px; color: #cdbf9f; letter-spacing: 4px; }
  .big b { display: block; font-weight: 900; font-size: 92px; color: #ff4045; margin-top: 10px; text-shadow: 0 0 30px rgba(255,40,40,.4); }
</style></head>
<body class="grain">
  <div class="strip a"><div class="lbl">สมุด รปภ. · 21.10 · คดีที่ ๒</div>
    <div class="r">แขก <b>น.ส.สุดา ใจเย็น</b> บ.ธนากรวัสดุ<br>ติดต่อชั้น 4 รับบัตร V-07</div></div>
  <div class="strip b"><div class="lbl" style="top:-60px">ใบสำคัญจ่ายสองล้าน · คดีที่ ๑</div>
    <span class="sig">สุดา</span>ผู้จัดทำ<br>(น.ส.สุดา ใจเย็น)</div>
  <svg class="m" viewBox="0 0 1080 1920" fill="none" stroke="#ff2a2f" stroke-width="8" stroke-linecap="round">
    <ellipse cx="440" cy="378" rx="175" ry="50" transform="rotate(-2.5 440 378)"/>
    <ellipse cx="540" cy="1050" rx="230" ry="60" transform="rotate(2 540 1050)"/>
    <path d="M430 430 C 300 650, 640 720, 540 985" stroke-dasharray="22 16"/>
  </svg>
  <div class="big"><small>V-07 ไม่ใช่คุณวิโรจน์</small><b>สุดา ใจเย็น</b></div>
</body></html>
